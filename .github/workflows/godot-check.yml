name: Validate WILDLINE Godot prototype

on:
  push:
    branches:
      - godot-prototype
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    branches:
      - godot-prototype
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" "ndk;27.2.12479018" "cmake;3.22.1"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Install Godot 4.4.1 and Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -O /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_source.zip"
          godot --version

      - name: Configure Godot Android export settings
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -storetype JKS -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/.android/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Import project and scan scripts
        run: godot --headless --editor --path godot --quit

      - name: Install Android build template into project
        run: godot --headless --editor --path godot --install-android-build-template --quit

      - name: Boot the prototype scene
        run: godot --headless --path godot --quit-after 120 --verbose

      - name: Assert world, player, collision and interaction HUD
        run: godot --headless --path godot --script res://scripts/smoke_test.gd

      - name: Export browser build for validation
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/web
          godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html" --verbose
          test -s build/web/index.html
          find build/web -maxdepth 1 -type f -printf '%f %s bytes\\n'

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$JAVA_HOME/bin:$PATH"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p godot/build
          APK_PATH="$GITHUB_WORKSPACE/godot/build/WILDLINE-debug.apk"
          if ! godot --headless --path godot --export-debug "Android" "$APK_PATH" --verbose 2>&1 | tee godot/build/android-export.log || ! test -s "$APK_PATH"; then
            echo "Direct APK export failed; retrying with Godot Gradle build."
            rm -f "$APK_PATH"
            sed -i 's#gradle_build/use_gradle_build=false#gradle_build/use_gradle_build=true#' godot/export_presets.cfg
            godot --headless --path godot --export-debug "Android" "$APK_PATH" --verbose 2>&1 | tee godot/build/android-gradle-export.log
          fi
          test -s "$APK_PATH"

      - name: Upload Android APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: WILDLINE-Android-debug
          path: godot/build/WILDLINE-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish installable APK for Android testing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="android-debug-latest"
          TITLE="WILDLINE Android Test APK"
          NOTES="APK de prueba de WILDLINE generado desde la rama godot-prototype. Es una compilación de diagnóstico, no una versión final."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" godot/build/WILDLINE-debug.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" godot/build/WILDLINE-debug.apk --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          fi
          gh release view "$TAG" --json url,assets
